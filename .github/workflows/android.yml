name: Android CI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept licenses and install packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - name: Write local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Install Gradle 8.9
        run: |
          curl -fsSL -o /tmp/gradle-8.9-bin.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          sudo unzip -q /tmp/gradle-8.9-bin.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> $GITHUB_PATH
          /opt/gradle-8.9/bin/gradle -v

      - name: Generate wrapper
        run: |
          /opt/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ls -la gradlew gradle/wrapper/

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace --info 2>&1 | tail -n 200

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: forge-ai-lab-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
